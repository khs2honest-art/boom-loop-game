name = "boom-loop"
main = "worker.js"
compatibility_date = "2026-10-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "boom-loop-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 0 * * *"]
